<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Frases</title>

<style>

body{
    font-family: Arial;
    max-width:700px;
    margin:auto;
    padding:40px;
}

.frase{
    border:1px solid #ddd;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
}

button{
    margin-top:10px;
    padding:8px 15px;
    cursor:pointer;
}

</style>

</head>

<body>

<h1>Minhas Frases</h1>

<div class="frase">

<p id="f1">

Bom dia!

</p>

<button onclick="copiar('f1')">

📋 Copiar

</button>

</div>

<div class="frase">

<p id="f2">

Como você está?

</p>

<button onclick="copiar('f2')">

📋 Copiar

</button>

</div>

<script>

function copiar(id){

const texto=document.getElementById(id).innerText;

navigator.clipboard.writeText(texto);

alert("Frase copiada!");

}

</script>

</body>

</html>
