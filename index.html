<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Frases para copiar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f4f4;
    color:#222;
    padding:40px 20px;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:35px;
}

.card{
    background:white;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:35px;
    overflow:hidden;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#eeeeee;
    padding:12px 18px;
}

.header h2{
    font-size:18px;
}

button{
    border:none;
    background:#2563eb;
    color:white;
    padding:8px 16px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
}

button:hover{
    background:#1d4ed8;
}

.content{
    padding:20px;
    white-space:pre-wrap;
    line-height:1.8;
    font-size:18px;
}

.divisor{
    border:none;
    border-top:2px dashed #ccc;
    margin:30px 0;
}
</style>

</head>
<body>

<div class="container">

<h1>Frases</h1>

<!-- ========================= FRASE 1 ========================= -->

<div class="card">

    <div class="header">
        <h2>Português</h2>
        <button onclick="copiar('pt1', this)">Copiar</button>
    </div>

    <div class="content" id="pt1">Meu nome é Anna. Eu sou do Canadá.</div>

</div>

<hr class="divisor">

<div class="card">

    <div class="header">
        <h2>Inglês + Vocabulário</h2>
        <button onclick="copiar('en1', this)">Copiar</button>
    </div>

    <div class="content" id="en1">My name is Anna. I am from Canada.

Meu nome = my name
É = is
Eu = I
Sou = am</div>

</div>

<!-- =========================================================== -->

<script>

function copiar(id, botao){

    const texto = document.getElementById(id).innerText;

    navigator.clipboard.writeText(texto);

    botao.innerText = "Copiado!";

    setTimeout(function(){

        botao.innerText = "Copiar";

    },1500);

}

</script>

</body>
</html>
