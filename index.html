<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Frases em Português</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width:900px;
    margin:40px auto;
    padding:20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.frase{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:25px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.linha{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
}

.texto{
    flex:1;
    line-height:1.7;
}

.portugues{
    font-size:22px;
    font-weight:bold;
}

.ingles{
    margin-top:18px;
    padding-top:18px;
    border-top:2px solid #ddd;
}

.vocabulario{
    margin-top:12px;
    color:#555;
    font-size:15px;
}

button{
    white-space:nowrap;
    padding:8px 14px;
    border:none;
    border-radius:8px;
    background:#2d7ff9;
    color:white;
    cursor:pointer;
    font-size:14px;
}

button:hover{
    background:#165ec9;
}

</style>

</head>

<body>

<h1>Frases em Português</h1>

<div class="frase">

    <div class="linha">

        <div class="texto portugues" id="pt1">
            Meu nome é Anna.<br>
            Eu sou do Canadá.
        </div>

        <button onclick="copiar('pt1',this)">
            📋 Copiar
        </button>

    </div>

    <div class="ingles">

        <div class="linha">

            <div class="texto">

                <div id="en1">
                    My name is Anna.<br>
                    I am from Canada.
                </div>

                <div class="vocabulario">

                    Meu nome = My name<br>
                    É = is<br>
                    Eu = I<br>
                    Sou = am<br>
                    Do = from<br>
                    Canadá = Canada

                </div>

            </div>

            <button onclick="copiarTraducao(this)">
                📋 Copiar
            </button>

        </div>

    </div>

</div>

<script>

function copiar(id,botao){

    const texto=document.getElementById(id).innerText;

    navigator.clipboard.writeText(texto);

    feedback(botao);

}

function copiarTraducao(botao){

    const bloco=botao.parentElement;

    const texto=bloco.querySelector("#en1").innerText;

    navigator.clipboard.writeText(texto);

    feedback(botao);

}

function feedback(botao){

    const original=botao.innerHTML;

    botao.innerHTML="✅";

    setTimeout(()=>{
        botao.innerHTML=original;
    },1500);

}

</script>

</body>

</html>
